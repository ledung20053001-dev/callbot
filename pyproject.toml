[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-clinic-callbot"
version = "0.1.0"
description = "AI callbot for safe clinic appointment operations"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.27,<1.0",
    "langgraph>=1.0,<2.0",
    "structlog>=24.4,<26.0",
    "prometheus-client>=0.21,<1.0",
    "tenacity>=9.0,<10.0",
    "orjson>=3.10,<4.0",
    "python-multipart>=0.0.12,<1.0",
]

[project.optional-dependencies]
llm-openai = ["openai>=2.0,<3.0"]
audio = [
    "soundfile>=0.12,<1.0",
    "pydub>=0.25,<1.0",
]
telephony-twilio = ["twilio>=9.0,<10.0"]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=6.0,<8.0",
    "respx>=0.22,<1.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["clinic-mock"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
explicit_package_bases = true
exclude = ["clinic-mock"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-config --strict-markers"
markers = [
    "unit: isolated unit tests",
    "agent: conversation graph tests",
    "api: HTTP contract tests",
    "safety: severe-failure guardrail tests",
    "integration: tests requiring Clinic Mock",
    "slow: tests excluded from the default fast suite",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
